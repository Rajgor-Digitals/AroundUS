# Project-wide Gradle settings.

# Enable Gradle Daemon for faster builds
org.gradle.daemon=true

# Enable parallel execution of independent tasks
org.gradle.parallel=true

# Enable Gradle Build Cache to reuse task outputs
org.gradle.caching=true

# Enable Configuration on Demand to only configure relevant subprojects
org.gradle.configureondemand=true

# Memory and GC optimizations for Gradle Daemon
org.gradle.jvmargs=-Xmx4096m -XX:+UseG1GC -XX:MaxMetaspaceSize=1024m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8

# Memory and GC optimizations for Kotlin Daemon
kotlin.daemon.jvmargs=-Xmx2048m -XX:+UseG1GC

# Enable Kotlin Incremental Compilation
kotlin.incremental=true

# Android Gradle Plugin Build Optimizations
android.useAndroidX=true
android.nonTransitiveRClass=true
android.nonFinalResIds=true
android.defaults.buildfeatures.resvalues=true
android.sdk.defaultTargetSdkToCompileSdkIfUnset=false
android.enableAppCompileTimeRClass=false
android.usesSdkInManifest.disallowed=false
android.uniquePackageNames=false
android.dependency.useConstraints=true
android.r8.strictFullModeForKeepRules=false
android.r8.optimizedResourceShrinking=false
android.builtInKotlin=false
android.newDsl=false


# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true
